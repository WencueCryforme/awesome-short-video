name: Build Site and Deploy as Pages

on:
  push:
    paths:
      - 'site/**'
      - 'video/**'
      - 'scripts/**'
      - 'VERSION'
      - '.github/workflows/build-site-and-deploy-as-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 取两条提交,便于比对 hash_id 是否被批量改写
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Check version consistency
        run: node scripts/sync-version.mjs --check

      - name: Install site dependencies
        working-directory: site
        run: npm install --no-audit --no-fund

      - name: Validate video manifest
        run: node scripts/check-video-manifest.mjs

      - name: Check hash_id stability
        run: |
          node -e '
          const { execSync } = require("node:child_process")
          const fs = require("node:fs")
          let previous = null
          try {
            previous = JSON.parse(execSync("git show HEAD~1:video/manifest.json", { encoding: "utf8", stdio: ["ignore", "pipe", "ignore"] }))
          } catch (error) {
            console.log("没有可比对的历史清单,跳过 hash_id 稳定性检查")
            process.exit(0)
          }
          const current = JSON.parse(fs.readFileSync("video/manifest.json", "utf8"))
          const before = new Map(previous.total.map(item => [item.filename, item.hash_id]))
          const changed = current.total.filter(item => before.has(item.filename) && before.get(item.filename) !== item.hash_id)
          if (changed.length === 0) {
            console.log("hash_id 全部沿用,无批量变更")
            process.exit(0)
          }
          for (const item of changed) {
            console.log("::warning file=video/manifest.json::" + item.filename + " 的 hash_id 由 " + before.get(item.filename) + " 变为 " + item.hash_id + ",已分发的分享链接与已收录页面会失效")
          }
          console.log("共 " + changed.length + " 个条目的 hash_id 发生变化,确认是否为 sort 的 --force 造成")
          '

      - name: Check manifest history
        run: node scripts/try2-update-manifest-his.mjs --check

      - name: Run script tests
        run: npm test

      - name: Generate static site
        working-directory: site
        env:
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/
        run: npm run generate

      - name: Build single video pages
        run: node scripts/build-single-video-pages.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
